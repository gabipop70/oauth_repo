<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>ANAF OAuth Callback</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 50px;">
    <h2 style="color: #2e7d32;">Se finalizează autentificarea ANAF...</h2>
    <p id="status">Vă rugăm așteptați, sunteți redirecționat către aplicație.</p>

    <script>
        // Extract parametrul "code" din URL-ul trimis de ANAF
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // Trimite AUTOMAT codul către serverul local Python care ascultă pe portul 8080
            window.location.href = `http://localhost:8080/?code=${code}`;
        } else {
            document.getElementById('status').innerText = 'Eroare: Nu s-a detectat niciun cod de la ANAF.';
        }
    </script>
</body>
</html>
